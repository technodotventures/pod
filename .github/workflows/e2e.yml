name: E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Create dev env file
        run: |
          printf 'COFFEE_POD_HOST=127.0.0.1\nCOFFEE_POD_PORT=8733\nCOFFEE_POD_DATA_DIR=./data\nCOFFEE_POD_ID=ci\nCOFFEE_POD_NAME=CI Pod\nCOFFEE_POD_API_TOKEN=\n' > .env

      - name: Unit + integration tests
        run: npm test

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E suite (journeys, a11y, visual)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces, videos, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 7
