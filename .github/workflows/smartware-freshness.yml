name: Smartware freshness

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Verify pinned Smartware release
        run: npm run verify:smartware-release

      - name: Check upstream Smartware freshness
        run: npm run check:smartware-upstream
