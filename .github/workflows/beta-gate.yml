name: Beta gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: beta-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 26 = the repo's verified runtime (docs/install.md).
          # Node 22 cancels the watch-auth tests (event loop drains while promises are pending).
          node-version: 26
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit --audit-level=low

      - name: Verify Pod beta
        run: |
          npm run beta:gate
          npm run benchmark:recall

      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Package unsigned macOS beta
        run: npm run desktop:pack
