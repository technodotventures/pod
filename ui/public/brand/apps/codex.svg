<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#B5A8EE"/>
      <stop offset="50%" stop-color="#8B8DF2"/>
      <stop offset="100%" stop-color="#4F6AF5"/>
    </linearGradient>
  </defs>
  <!-- Cloud with 5 distinct rounded lobes -->
  <circle cx="50" cy="38" r="24" fill="url(#cg)"/>
  <circle cx="30" cy="50" r="20" fill="url(#cg)"/>
  <circle cx="70" cy="50" r="20" fill="url(#cg)"/>
  <circle cx="36" cy="70" r="18" fill="url(#cg)"/>
  <circle cx="64" cy="70" r="18" fill="url(#cg)"/>
  <!-- Fill center -->
  <rect x="16" y="38" width="68" height="40" fill="url(#cg)"/>
  <rect x="26" y="30" width="48" height="50" fill="url(#cg)"/>
  <!-- Terminal chevron > -->
  <path d="M30 42l12 12-12 12" stroke="white" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Terminal underscore _ -->
  <rect x="52" y="58" width="18" height="6" rx="3" fill="white"/>
</svg>
